<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — SecureNote</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <div class="container">

        <header class="header">
            <div class="header-inner">
                <div class="logo">
                    <div class="logo-mark">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </div>
                    <div class="logo-wordmark">SecureNote</div>
                </div>
                <div class="header-chip">
                    <span class="header-chip-dot"></span>
                    Twofish CBC 128-bit
                </div>
            </div>
        </header>

        <div class="fade-in" style="max-width:400px; margin:0 auto;">

            <h2 class="section-title">Masuk ke Akun</h2>
            <p class="section-desc">Masukkan username dan password untuk mengakses catatan kamu.</p>

            <div class="alert alert-error" id="alertError">
                <span id="alertErrorMsg">Terjadi kesalahan.</span>
            </div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="inputUsername" placeholder="Masukkan username..." />
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrap">
                    <input type="password" class="form-input mono-input" id="inputPassword"
                        placeholder="Masukkan password..." />
                    <button class="toggle-eye" type="button" onclick="togglePassword('inputPassword', this)"
                        tabindex="-1">
                        <svg viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>

            <button class="btn btn-primary btn-full" id="btnLogin" onclick="doLogin()">
                Masuk
            </button>

            <p style="text-align:center; margin-top:20px; font-size:13px; color:var(--text-muted);">
                Belum punya akun?
                <a href="register.html" style="color:var(--accent); font-weight:500;">Daftar sekarang</a>
            </p>

        </div>
    </div>

    <script>
        // Redirect jika sudah login
        async function checkSession() {
            try {
                const res = await fetch('api/check_session.php');
                const json = await res.json();
                if (json.loggedIn) window.location.href = 'index.html';
            } catch (e) { }
        }
        checkSession();

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
            btn.style.opacity = input.type === 'text' ? '1' : '0.4';
        }

        function showError(msg) {
            document.getElementById('alertErrorMsg').textContent = msg;
            document.getElementById('alertError').classList.add('visible');
        }

        async function doLogin() {
            const username = document.getElementById('inputUsername').value.trim();
            const password = document.getElementById('inputPassword').value;
            const btn = document.getElementById('btnLogin');

            if (!username) return showError('Username tidak boleh kosong.');
            if (!password) return showError('Password tidak boleh kosong.');

            btn.disabled = true;
            btn.textContent = 'Memproses...';

            try {
                const res = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const json = await res.json();

                if (json.success) {
                    window.location.href = 'index.html';
                } else {
                    showError(json.message);
                    btn.disabled = false;
                    btn.textContent = 'Masuk';
                }
            } catch (err) {
                showError('Gagal terhubung ke server.');
                btn.disabled = false;
                btn.textContent = 'Masuk';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('inputPassword').addEventListener('keydown', e => {
                if (e.key === 'Enter') doLogin();
            });
        });
    </script>

</body>

</html>
